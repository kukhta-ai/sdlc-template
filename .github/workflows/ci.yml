name: CI

on:
  push:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: maintainer gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n scripts/init-project.sh
          bash -n template/scripts/setup.sh

      - name: Root and payload boundaries
        run: |
          test -f AGENTS.md
          test -f template/AGENTS.md
          test -f template/scripts/setup.sh
          test -f template/docs/SDLC.md
          test -f template/docs/task-writing-conventions.md
          test -d backlog
          test -d template/backlog
          test ! -f docs/SDLC.md
          test ! -f scripts/setup.sh

      - name: Whitespace check
        run: git diff --check HEAD
